name: Build & Release macOS

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Universal macOS App & DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME#v}"
            echo "app_version=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          else
            PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Packaging/Info.plist 2>/dev/null || echo '1.1.0')"
            echo "app_version=${PLIST_VER}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_num=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_OUTPUT"

      - name: Build Universal .app, .dmg, and .zip
        run: |
          cd macos
          bash build_macos.sh \
            --universal \
            --dmg \
            --zip \
            --version "${{ steps.version.outputs.app_version }}" \
            --build "${{ steps.version.outputs.build_num }}" \
            --repo "${{ github.repository }}"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HieroDict-macOS-Universal
          path: |
            macos/dist/HieroDict-macOS-Universal.dmg
            macos/dist/HieroDict-macOS-Universal.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            macos/dist/HieroDict-macOS-Universal.dmg
            macos/dist/HieroDict-macOS-Universal.zip
